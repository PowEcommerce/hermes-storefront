# ============================================================
# Secretos y referencias internas, en cada PR y en cada push.
#
# - gitleaks: toda la historia de git (`gitleaks git`) y el árbol actual
#   (`gitleaks dir`), con las reglas por defecto más los tokens de Hermes
#   (.gitleaks.toml). El binario se baja del release oficial y se verifica
#   su sha256 (sin acciones de terceros).
# - internos: scripts/tarball-sin-internos.sh sobre las líneas agregadas
#   (el diff del PR o del push) y sobre todo el árbol: hosts internos, IPs
#   privadas, tokens con valor, IDs de 32 hex, rutas locales y nombres de
#   marcas (lista hasheada).
#
# Si algo se filtró: ROTALO (ver SECURITY.md). Borrarlo del repo no alcanza.
# ============================================================
name: Secretos

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 de gitleaks_<versión>_linux_x64.tar.gz (del checksums.txt del release).
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Instalar gitleaks (verificado por sha256)
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tgz}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Historia de git
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner -v

      - name: Árbol actual
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner -v

  internos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Líneas agregadas (diff del PR o del push)
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "pull_request" ]; then
            base=$(git merge-base "$BASE_PR" HEAD)
          elif [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            base="$ANTES"
          else
            # Branch nueva (o primer push): el árbol completo lo cubre el paso siguiente.
            echo "Sin commit base para el diff: sólo el árbol completo."
            exit 0
          fi
          scripts/tarball-sin-internos.sh --diff "$base"

      - name: Todo el árbol
        run: scripts/tarball-sin-internos.sh --arbol
