# Actualizaciones de dependencias. Las acciones están fijadas por SHA:
# Dependabot actualiza el SHA y el comentario de la versión juntos.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /packages/storefront
      - /packages/cli
      - /packages/create-store
      - /starter
      - /starter-demo
      - /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Los saltos de versión mayor (vitest 5, TypeScript 7, etc.) se hacen a mano:
    # suelen romper peer dependencies entre paquetes. Las alertas de seguridad
    # siguen llegando por dependabot_security_updates aunque sean mayores.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
