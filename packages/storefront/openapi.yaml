  /api/v2/home/page_blocks:
    get:
      description: >-
        Las secciones de la home (bloques agrupados por ancho, en orden) y settings de la marca para
        pintarla. Sólo bloques activos y vigentes (fecha/día). Las URLs de imágenes son absolutas.
      operationId: Home_pageBlocks
      parameters:
        - name: home_version_token
          required: false
          in: query
          description: >-
            Vista previa de una versión de la home (borrador, programada, etc.): el token del link
            que arma el backoffice. Si existe y no venció, la respuesta trae los bloques de ESA
            versión, el objeto `preview` y `Cache-Control: no-store` (no cachearla). Token inválido
            o vencido: la respuesta normal, sin `preview` y sin error.
          schema:
            type: string
        - name: pb_type
          required: false
          in: query
          description: >-
            Tipo de página. Los cuatro primeros valen en todas las marcas; `Locales` y `NINOS` sólo
            en las marcas que tienen esa sección. Ausente, inválido o de otra marca: el de la tienda
            (`OUTLET` en un outlet, `Main Store` si no).
          schema:
            enum:
              - Main Store
              - OUTLET
              - Landing
              - Landing Outlet
              - Locales
              - NINOS
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomePageBlocks'
      security:
        - storefront_token: []
        - client_id: []
      summary: Bloques de la home
      tags:
        - Contenido
      x-cache-tags:
        - home-page-blocks
      x-cache-ttl: short
  /api/v2/items:
    get:
      description: >-
        Las tarjetas de los productos de una lista de SKUs: lo que usan el carrusel de SKUs de la
        home (`PageBlock::SkuCarousel`), KitLook, Shop the Look y «últimos vistos». Un record por
        producto+color publicado y con stock que tenga ALGUNO de los SKUs pedidos entre sus talles
        (`variant.grouped_skus`); la variante del record es la representante del color, no
        necesariamente la pedida. Vienen en el orden de los SKUs pedidos (cada record en la posición
        del primer SKU suyo de la lista). Los SKUs sin producto publicado con stock no devuelven
        nada. Hasta 100 SKUs por pedido.
      operationId: Pdp_bySkus
      parameters:
        - name: skus
          required: true
          in: query
          description: >-
            SKUs separados por coma (o espacio), en el orden en que se quieren las tarjetas. Ej:
            `030250CR.A00S,063343NE.J026`. Sin SKUs: `{ records: [], total: 0 }`.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductosPorSku'
        '400':
          description: Pedido mal formado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_token: []
        - client_id: []
      summary: Productos por SKU
      tags:
        - Catálogo
      x-cache-tags:
        - products
      x-cache-ttl: short
