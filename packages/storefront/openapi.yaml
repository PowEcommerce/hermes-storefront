  /api/v2/checkout_sessions:
    post:
      description: >-
        Server-side o desde el navegador, con el token PÚBLICO de la agencia (`pst_`). `return_url`
        y `cancel_url` son opcionales (cada una por separado); si vienen, deben ser https y de un
        dominio permitido para ese token (los carga Pow) o un host propio de la marca en el hosting
        de Hermes (su `www.<dominio>` activo o un host `…--<marca>.hermescdn.app` de sus deploys).
        Sin `return_url` (p. ej. desarrollando en localhost) la compra termina en la confirmación
        del checkout de la marca. Devuelve el link al checkout de Pow en el dominio de la marca
        (`https://<marca>/checkout/s/<id>`): el dominio propio de la tienda hosteada en Hermes si
        tiene uno activo (`www.<dominio>`, o `checkout.<dominio>` si sólo tiene ése), o el
        storefront configurado. Redirigí al comprador ahí. La sesión es de un solo uso y vence a las
        24 h sin abrirse.
      operationId: CheckoutSessions_crear
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSessionCrear'
      responses:
        '201':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionCreada'
        '401':
          description: Falta el token o es inválido / revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Datos inválidos: `{ "errors": ["…"] }`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '503':
          description: Funcionalidad no habilitada para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_token: []
      summary: Crear una sesión de checkout hosteado
      tags:
        - Sesiones de checkout
  /api/v2/checkout_sessions/{id}:
    get:
      description: >-
        SÓLO server-side, con el token PRIVADO (`psk_`, scope `checkout_sessions:read`). Si el pago
        sigue abierto se re-consulta a la pasarela (a lo sumo cada 10 s), así que sirve para el
        "gracias por tu compra" de la agencia aunque el comprador vuelva directo desde Mercado Pago.
        Para enterarte sin consultar, suscribite al webhook `checkout/completed`.
      operationId: CheckoutSessions_leer
      parameters:
        - name: id
          required: true
          in: path
          description: Id de la sesión (`cs_` + 48 hex)
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '401':
          description: Falta el token o es inválido / revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_private_token: []
      summary: Leer el estado de una sesión y su pago
      tags:
        - Sesiones de checkout
  /api/v2/checkout_sessions/{id}/claim:
    post:
      description: >-
        USO INTERNO del checkout hosteado: lo llama el worker de la marca al abrir
        `/checkout/s/<id>`, una sola vez. Una agencia no necesita llamarlo. 409 si ya se usó, 410 si
        venció, 422 si el carrito ya no sirve; los errores traen `cancel_url` para volver a la
        agencia (null si la sesión se creó sin ella).
      operationId: CheckoutSessions_canjear
      parameters:
        - name: id
          required: true
          in: path
          description: Id de la sesión (`cs_` + 48 hex)
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionCanje'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto (el recurso ya cambió de estado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Datos inválidos: `{ "errors": ["…"] }`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '503':
          description: Funcionalidad no habilitada para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Canjear una sesión (lo usa el checkout de la marca)
      tags:
        - Sesiones de checkout
