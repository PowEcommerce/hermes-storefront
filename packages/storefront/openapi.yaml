openapi: 3.1.0
paths:
  /api/resenas/unsubscribe:
    post:
      description: >-
        Lo llama el cliente de mail (Gmail, Apple Mail…) desde el header `List-Unsubscribe-Post` del
        mail de pedido de opinión, con cuerpo `List-Unsubscribe=One-Click`. SIN autenticación ni
        `X-Client-ID`: la marca sale del `token` firmado. Va fuera de `/api/v2` a propósito. Una
        agencia no necesita llamarlo. Hasta 30 pedidos por hora por IP.
      operationId: ResenasBajaUnClick_unClick
      parameters:
        - name: token
          required: true
          in: query
          description: Token firmado del link de baja (empieza con la marca).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResenaBaja'
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Demasiados pedidos: respetá el header `Retry-After` (segundos)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Baja en un click (List-Unsubscribe, RFC 8058)
      tags:
        - Reseñas
  /api/storefront/items:
    get:
      description: >-
        Los productos publicados con stock, con los filtros y el orden de la PLP, en la forma cruda
        del catálogo (`records`). Para un storefront nuevo preferí `GET /api/v2/products`, que trae
        el producto ya armado (precios, cuotas, etiquetas). Cacheado unos minutos por combinación de
        filtros.
      operationId: Items_index
      parameters:
        - name: page_number
          required: false
          in: query
          description: Página (desde 1). El tamaño de página lo decide la marca/categoría.
          schema:
            type: number
        - name: multicolors
          required: false
          in: query
          description: Colores separados por coma, p. ej. `Negro,Blanco`.
          schema:
            type: string
        - name: Color
          required: false
          in: query
          description: Un color (alternativa a `multicolors`).
          schema:
            type: string
        - name: multisizes
          required: false
          in: query
          description: Talles separados por coma, p. ej. `S,M`.
          schema:
            type: string
        - name: Talle
          required: false
          in: query
          description: Un talle (alternativa a `multisizes`).
          schema:
            type: string
        - name: Texture
          required: false
          in: query
          description: >-
            Nombre de la propiedad principal (textura). Además se puede filtrar por cualquier otra
            propiedad de la marca usando su nombre como parámetro y la descripción de la opción como
            valor (p. ej. `Material=Algodón`).
          schema:
            type: string
        - name: multicategories
          required: false
          in: query
          description: >-
            Slugs de categorías separados por coma (incluye subcategorías). Sólo marcas con la
            faceta `Categorias`.
          schema:
            type: string
        - name: min_and_max_price
          required: false
          in: query
          description: 'Rango de precio en JSON, en la moneda de la marca: `{"min":1000,"max":5000}`.'
          schema:
            type: string
        - name: discount_ranges
          required: false
          in: query
          description: >-
            Rangos de descuento separados por coma (`1-20,40-60`). Sólo si la marca muestra el
            filtro.
          schema:
            type: string
        - name: llega_hoy
          required: false
          in: query
          description: '`true`/`false`: envío en el día (sólo marcas que lo usan).'
          schema:
            type: string
        - name: variant_sku
          required: false
          in: query
          description: SKUs separados por espacio.
          schema:
            type: string
        - name: price
          required: false
          in: query
          description: 'Ordenar por precio: `1` ascendente, `-1` descendente.'
          schema:
            enum:
              - '1'
              - '-1'
            type: string
        - name: views
          required: false
          in: query
          description: Ordenar por más vistos (`-1`).
          schema:
            enum:
              - '1'
              - '-1'
            type: string
        - name: new
          required: false
          in: query
          description: Ordenar por más nuevos (`-1`).
          schema:
            enum:
              - '1'
              - '-1'
            type: string
        - name: text
          required: false
          in: query
          description: 'Lista JSON de ids de producto (`[12,7,30]`): filtra y ordena en ese orden.'
          schema:
            type: string
        - name: category_id
          required: false
          in: query
          description: Id de la categoría (alternativa a `category_name`).
          schema:
            type: number
        - name: category_name
          required: false
          in: query
          description: Slug de la categoría (incluye sus subcategorías).
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoListado'
      security:
        - storefront_token: []
        - client_id: []
      summary: Listado crudo del catálogo (PLP)
      tags:
        - Catálogo
      x-cache-tags:
        - products
        - category-{category_name}
      x-cache-ttl: short
  /api/storefront/items/filters:
    get:
      description: >-
        Las opciones de cada filtro (color, talle, …) con la cantidad de productos, para el conjunto
        filtrado. Una faceta no se acota por su propio filtro (con `Talle=M` siguen viniendo todos
        los talles). Mismos parámetros que el listado.
      operationId: Items_filters
      parameters:
        - name: page_number
          required: false
          in: query
          description: Página (desde 1). El tamaño de página lo decide la marca/categoría.
          schema:
            type: number
        - name: multicolors
          required: false
          in: query
          description: Colores separados por coma, p. ej. `Negro,Blanco`.
          schema:
            type: string
        - name: Color
          required: false
          in: query
          description: Un color (alternativa a `multicolors`).
          schema:
            type: string
        - name: multisizes
          required: false
          in: query
          description: Talles separados por coma, p. ej. `S,M`.
          schema:
            type: string
        - name: Talle
          required: false
          in: query
          description: Un talle (alternativa a `multisizes`).
          schema:
            type: string
        - name: Texture
          required: false
          in: query
          description: >-
            Nombre de la propiedad principal (textura). Además se puede filtrar por cualquier otra
            propiedad de la marca usando su nombre como parámetro y la descripción de la opción como
            valor (p. ej. `Material=Algodón`).
          schema:
            type: string
        - name: multicategories
          required: false
          in: query
          description: >-
            Slugs de categorías separados por coma (incluye subcategorías). Sólo marcas con la
            faceta `Categorias`.
          schema:
            type: string
        - name: min_and_max_price
          required: false
          in: query
          description: 'Rango de precio en JSON, en la moneda de la marca: `{"min":1000,"max":5000}`.'
          schema:
            type: string
        - name: discount_ranges
          required: false
          in: query
          description: >-
            Rangos de descuento separados por coma (`1-20,40-60`). Sólo si la marca muestra el
            filtro.
          schema:
            type: string
        - name: llega_hoy
          required: false
          in: query
          description: '`true`/`false`: envío en el día (sólo marcas que lo usan).'
          schema:
            type: string
        - name: variant_sku
          required: false
          in: query
          description: SKUs separados por espacio.
          schema:
            type: string
        - name: text
          required: false
          in: query
          description: Lista JSON de ids de producto.
          schema:
            type: string
        - name: category_id
          required: false
          in: query
          schema:
            type: number
        - name: category_name
          required: false
          in: query
          description: Slug de la categoría.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoFacetas'
      security:
        - storefront_token: []
        - client_id: []
      summary: Facetas del listado
      tags:
        - Catálogo
      x-cache-tags:
        - products
        - category-{category_name}
      x-cache-ttl: short
  /api/storefront/sitemap:
    get:
      description: >-
        Todo el catálogo publicado en una respuesta JSON (productos, categorías y páginas estáticas
        con su fecha de actualización) para generar el `sitemap.xml` del lado del storefront.
        `Cache-Control: public, s-maxage=3600, stale-while-revalidate=86400`.
      operationId: Sitemap_index
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sitemap'
      security:
        - storefront_token: []
        - client_id: []
      summary: Datos para el sitemap
      tags:
        - Catálogo
      x-cache-tags:
        - products
        - categories
        - landings
      x-cache-ttl: long
  /api/v2/cart:
    get:
      description: >-
        El carrito del `X-Cart-Token` con precios calculados al momento (nada se congela hasta el
        checkout). Sin token, con uno inválido o vencido (30 días sin actividad) devuelve el carrito
        vacío y NO crea nada.
      operationId: Cart_show
      parameters:
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrito'
      security:
        - storefront_token: []
        - client_id: []
      summary: Ver el carrito
      tags:
        - Carrito
  /api/v2/cart/add:
    post:
      description: >-
        Crea el carrito si no hay uno: el token nuevo (`crt_` + 40 hex) vuelve UNA sola vez en el
        header de respuesta `X-Cart-Token` — guardalo (cookie httpOnly server-side) y mandalo en
        cada pedido siguiente. Vive 30 días desde la última actividad. Sin reserva de stock: la
        cantidad se recorta al tope disponible (`quantity_added`). Con `include_cart: true` la
        respuesta trae el carrito completo.
      operationId: Cart_add
      parameters:
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarritoAgregar'
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token:
              description: Token del carrito recién creado (sólo cuando este pedido lo crea).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoAgregado'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoError'
        '422':
          description: Datos inválidos o paso incompleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoError'
      security:
        - storefront_token: []
        - client_id: []
      summary: Agregar una variante
      tags:
        - Carrito
  /api/v2/cart/apply_coupon:
    post:
      description: >-
        Primero prueba el código como promoción (`type: offline_promotion`), si no como cupón
        (`type: coupon`). Un cupón por carrito: el anterior se saca siempre. El carrito tiene que
        existir (422 "El carrito está vacío").
      operationId: Cart_applyCoupon
      parameters:
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  example: BIENVENIDA10
              required:
                - code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoMensaje'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoError'
        '422':
          description: Datos inválidos o paso incompleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoError'
      security:
        - storefront_token: []
        - client_id: []
      summary: Aplicar un cupón o código de promoción
      tags:
        - Carrito
  /api/v2/cart/apply_promotion:
    post:
      description: Para las marcas con "Elegí tu promoción" (`promotions.selectable`). Devuelve el carrito.
      operationId: Cart_applyPromotion
      parameters:
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                promotion_id:
                  type: integer
                  description: Id de `promotions.options[]`.
              required:
                - promotion_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrito'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoError'
        '422':
          description: Datos inválidos o paso incompleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoError'
      security:
        - storefront_token: []
        - client_id: []
      summary: Elegir una promoción
      tags:
        - Carrito
  /api/v2/cart/items/{id}:
    patch:
      description: Setea la cantidad (mínimo 1; se recorta al tope de stock). Devuelve el carrito.
      operationId: Cart_updateItem
      parameters:
        - name: id
          required: true
          in: path
          description: Id de la línea (`items[].id`).
          schema:
            type: string
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 1
              required:
                - quantity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrito'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoError'
        '422':
          description: Datos inválidos o paso incompleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoError'
      security:
        - storefront_token: []
        - client_id: []
      summary: Cambiar la cantidad de una línea
      tags:
        - Carrito
    delete:
      operationId: Cart_removeItem
      parameters:
        - name: id
          required: true
          in: path
          description: Id de la línea (`items[].id`).
          schema:
            type: string
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoMensaje'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoError'
      security:
        - storefront_token: []
        - client_id: []
      summary: Sacar una línea
      tags:
        - Carrito
  /api/v2/cart/recommended:
    get:
      description: >-
        Hasta 4 variantes con stock de productos que no están en el carrito ("¿Te gustaría
        agregar…?"). Nunca falla: ante un error devuelve `items: []`.
      operationId: Cart_recommended
      parameters:
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoRecomendados'
      security:
        - storefront_token: []
        - client_id: []
      summary: Recomendados para el carrito
      tags:
        - Carrito
  /api/v2/cart/remove_coupon:
    post:
      description: 'Idempotente: sin carrito o sin cupón contesta igual.'
      operationId: Cart_removeCoupon
      parameters:
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarritoMensaje'
      security:
        - storefront_token: []
        - client_id: []
      summary: Quitar el cupón (y la promoción elegida)
      tags:
        - Carrito
  /api/v2/categories/header:
    get:
      description: >-
        Las categorías raíz visibles con sus hijas (columnas del mega-menú) y nietas, sólo las que
        tienen productos visibles; imágenes y cucardas del dropdown. `text_color` sugiere el color
        de letra del header.
      operationId: Categories_header
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriasHeader'
      security:
        - storefront_token: []
        - client_id: []
      summary: Árbol de categorías del menú
      tags:
        - Catálogo
      x-cache-tags:
        - header
        - categories
      x-cache-ttl: long
  /api/v2/checkout:
    get:
      description: >-
        Lo que cada paso necesita al montar: email, envío y facturación guardados, el paso permitido
        (`step`) y los totales. Sólo lee (nunca crea un carrito). Todo lo cargado vive en el carrito
        del `X-Cart-Token` hasta el pago.
      operationId: Checkout_show
      parameters:
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutEstado'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
      security:
        - storefront_token: []
        - client_id: []
      summary: Estado del checkout
      tags:
        - Checkout
  /api/v2/checkout/billing:
    put:
      description: >-
        Datos y dirección de facturación. Requiere el envío ya guardado (422 con `next: shipping` si
        no). `next` siempre es `payment`.
      operationId: Checkout_billing
      parameters:
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutFacturacionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutPasoOk'
        '422':
          description: Datos inválidos o paso incompleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
      security:
        - storefront_token: []
        - client_id: []
      summary: Guardar la facturación
      tags:
        - Checkout
  /api/v2/checkout/identify:
    post:
      description: >-
        Guarda el email en el carrito (opcional: sin email no escribe nada pero devuelve igual el
        `event_id_init_checkout`). 403 si el email está bloqueado.
      operationId: Checkout_identify
      parameters:
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutIdentificar'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutIdentificado'
        '403':
          description: Prohibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
        '422':
          description: Datos inválidos o paso incompleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
      security:
        - storefront_token: []
        - client_id: []
      summary: Identificar al comprador (invitado)
      tags:
        - Checkout
  /api/v2/checkout/ip:
    post:
      description: >-
        IP pública para el antifraude. `ok: false` si no hay carrito o la IP no tiene formato
        válido.
      operationId: Checkout_ip
      parameters:
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutIp'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOk'
      security:
        - storefront_token: []
        - client_id: []
      summary: Registrar la IP del comprador
      tags:
        - Checkout
  /api/v2/checkout/orders/{id}:
    get:
      description: >-
        La página de "gracias": estado, pago, envío, totales e ítems. Sólo para el dueño: el `token`
        de la orden (link del mail / vuelta de Checkout Pro) o el `X-Cart-Token` del carrito que la
        creó; a cualquier otro, 404. Si el pago sigue abierto se re-consulta a la pasarela (como
        mucho cada 10 s), así que sirve para polling.
      operationId: CheckoutPayment_order
      parameters:
        - name: id
          required: true
          in: path
          description: Id de la orden.
          schema:
            type: string
        - name: token
          required: false
          in: query
          description: Token de la orden.
          schema:
            type: string
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: false
          schema:
            type: string
