    WebhookEventoCheckoutCompleted:
      type: object
      properties:
        event:
          type: string
          enum:
            - checkout/completed
        id:
          type: string
          description: >-
            Id del evento: el mismo en cada reintento (y en el header `X-Webhook-Id`). Usalo para no
            procesar dos veces.
          example: '18342'
        timestamp:
          type: string
          format: date-time
          description: >-
            Cuándo salió ESTE intento (cambia en cada reintento). Rechazá los que tengan más de 5
            minutos.
        checkout_session:
          type: object
          properties:
            id:
              type: string
              example: cs_3f2a…
            status:
              type: string
              enum:
                - completed
            order_id:
              type: integer
            amount:
              type:
                - number
                - 'null'
            currency:
              type:
                - string
                - 'null'
            completed_at:
              type:
                - string
                - 'null'
              format: date-time
          required:
            - order_id
          description: >-
            La sesión de checkout de la orden (creada con el token público de tu agencia), igual que
            `GET /api/v2/checkout_sessions/{id}` (sin `payment_status`: consultalo con ese GET si lo
            necesitás).
      required:
        - event
        - id
        - timestamp
        - checkout_session
      description: >-
        Cuerpo del POST que recibe tu endpoint para `checkout/completed`. Headers:
        `X-Webhook-Event`, `X-Webhook-Id`, `X-Webhook-Signature: sha256=<hex>` (HMAC-SHA256 del
        cuerpo crudo con tu secreto).
    WebhookEventoPrueba:
      type: object
      properties:
        event:
          type: string
          enum:
            - webhook/test
        id:
          type: string
          example: test_5f1c0a9e2b7d4c3a1e0f9b8d
        timestamp:
          type: string
          format: date-time
        test:
          type: boolean
          enum:
            - true
        webhook_subscription:
          type: object
          properties:
            id:
              type: integer
            event:
              type: string
          required:
            - id
            - event
      required:
        - event
        - id
        - timestamp
        - test
        - webhook_subscription
      description: Cuerpo del evento de prueba (`POST …/test`).
    WebhookEventoStorefrontRevalidate:
      type: object
      properties:
        event:
          type: string
          enum:
            - storefront/revalidate
        id:
          type: string
          description: 'Id del evento: el mismo en cada reintento (y en `X-Webhook-Id`).'
          example: rv_mi-marca_179612345_0
        timestamp:
          type: string
          format: date-time
          description: Cuándo salió ESTE intento. Rechazá los que tengan más de 5 minutos.
        tags:
          type: array
          items:
            type: object
            properties:
              tag:
                type: string
                description: >-
                  Un tag de caché, con los MISMOS nombres que `x-cache-tags` de cada GET
                  (`product-remera`, `category-sale`, `settings`…).
                example: product-remera-lisa
              mode:
                type: string
                enum:
                  - soft
                  - hard
                description: >-
                  `soft` (default): marcalo stale y regeneralo atrás (stale-while-revalidate).
                  `hard`: expiralo ya — algo dejó de existir (categoría borrada u oculta, landing
                  despublicada o borrada) y no hay que servir la copia vieja ni una vez.
            required:
              - tag
              - mode
          description: >-
            Los tags purgados en esta ventana (las purgas se agrupan cada ~10 s; hasta 500 tags por
            evento, si hay más llegan varios eventos).
      required:
        - event
        - id
        - timestamp
        - tags
      description: >-
        Cuerpo del POST que recibe tu endpoint para `storefront/revalidate`: Pow purgó estos tags de
        la marca. Mismos headers y firma que el resto de los eventos.
    WebhookPrueba:
      type: object
      properties:
        delivered:
          type: boolean
          description: true si tu endpoint contestó 2xx.
        status:
          type:
            - integer
            - 'null'
          description: >-
            Status HTTP con el que contestó tu endpoint si fue 2xx/4xx/5xx; null en cualquier otro
            caso (redirect, timeout, DNS, destino bloqueado), sin detalle.
        event:
          type: string
          enum:
            - webhook/test
