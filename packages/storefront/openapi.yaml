    CheckoutSession:
      type: object
      properties:
        id:
          type: string
          pattern: ^cs_[0-9a-f]{48}$
          example: cs_3f2a9c0e5b7d41a88e6f0c2d9b1a7e4c5d6f8a0b1c2d3e4f
        status:
          type: string
          enum:
            - open
            - completed
            - expired
          description: >-
            `open` (creada o en curso), `completed` (la compra terminó: orden paga o pedida con
            medio offline), `expired` (venció sin usarse).
        order_id:
          type:
            - integer
            - 'null'
        amount:
          type:
            - number
            - 'null'
          description: Total de la orden en la moneda de la marca.
          example: 45999.9
        currency:
          type:
            - string
            - 'null'
          example: ARS
        payment_status:
          type:
            - string
            - 'null'
          enum:
            - paid
            - pending
            - failed
            - canceled
          description: >-
            `paid` pagada (o despachada/finalizada) · `pending` esperando el pago (p. ej.
            transferencia) · `failed` la pasarela rechazó el pago · `canceled` cancelada o vencido
            el plazo para pagar · `null` todavía sin orden.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - status
        - order_id
        - amount
        - currency
        - payment_status
        - expires_at
        - created_at
        - completed_at
    CheckoutSessionCanje:
      type: object
      properties:
        id:
          type: string
          pattern: ^cs_[0-9a-f]{48}$
          example: cs_3f2a9c0e5b7d41a88e6f0c2d9b1a7e4c5d6f8a0b1c2d3e4f
        cart_token:
          type: string
        return_url:
          type:
            - string
            - 'null'
          format: uri
          description: null si la sesión se creó sin `return_url`.
        cancel_url:
          type:
            - string
            - 'null'
          format: uri
          description: null si la sesión se creó sin `cancel_url`.
        expires_at:
          type: string
          format: date-time
        next:
          type: string
          enum:
            - shipping
            - login
          description: 'Primer paso del checkout: `login` si el carrito no tiene comprador.'
