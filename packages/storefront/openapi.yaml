  /api/v2/product_reviews:
    post:
      description: >-
        Crea la opinión (publicada o en moderación, según la configuración de la tienda y el
        riesgo). Exige el `captcha_token` de Turnstile. Con fotos declaradas en `photos`, la
        respuesta trae `uploads` (URLs prefirmadas): subí cada archivo con `PUT` y confirmá con
        `POST /api/v2/product_reviews/{id}/photos`. Topes: 10 opiniones creadas por IP y por tienda
        en 24 h (429 con `Retry-After`) y 30 intentos por hora por IP. 422 de validación con
        `field_errors` por campo; 409 si ya opinó sobre ese producto con el mismo link.
      operationId: Resenas_crear
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResenaCrear'
      responses:
        '201':
          description: Opinión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResenaCreada'
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto (el recurso ya cambió de estado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos o captcha no verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResenaErrorDeValidacion'
        '429':
          description: 'Demasiados pedidos: respetá el header `Retry-After` (segundos)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Funcionalidad no habilitada para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_token: []
        - client_id: []
      summary: Publicar una opinión
      tags:
        - Reseñas
  /api/v2/product_reviews/form:
    get:
      description: >-
        Lo necesario para armar el formulario: producto (imagen, color y talle si se conoce la
        variante), preguntas de la tienda, límites de fotos y la site key del captcha (Cloudflare
        Turnstile). Con el `token` del link del mail la compra queda verificada y vienen el nombre y
        los productos de la compra; sin `token` hace falta `product_id`, y sólo si la tienda acepta
        opiniones no verificadas (si no, 403). No se cachea.
      operationId: Resenas_formulario
      parameters:
        - name: token
          required: false
          in: query
          description: Token del link del mail de pedido de opinión.
          schema:
            type: string
        - name: variant_id
          required: false
          in: query
          description: Variante (para mostrar color y talle).
          schema:
            type: integer
        - name: product_id
          required: false
          in: query
          description: Id del producto (sin `token`, o para elegir uno de la compra).
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResenaFormulario'
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Funcionalidad no habilitada para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_token: []
        - client_id: []
      summary: Formulario para opinar
      tags:
        - Reseñas
      x-cache-ttl: none
  /api/v2/product_reviews/unsubscribe:
    get:
      description: >-
        Para la página de baja del pie del mail: con el `token` del link dice a qué email
        corresponde (enmascarado) y si ya está dado de baja en esta marca. No se cachea.
      operationId: Resenas_estadoDeBaja
      parameters:
        - name: token
          required: true
          in: query
          description: Token firmado del link de baja del mail.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResenaEstadoDeBaja'
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_token: []
        - client_id: []
      summary: Estado de la baja de los mails de pedido de opinión
      tags:
        - Reseñas
      x-cache-ttl: none
    post:
      description: >-
        Da de baja el email del `token` en esta marca: cancela lo pendiente (también el
        recordatorio) y los pedidos futuros. Idempotente. El `token` va en el cuerpo o en la query.
        Hasta 30 pedidos por hora por IP.
      operationId: Resenas_darDeBaja
      parameters:
        - name: token
          required: false
          in: query
          description: Token firmado del link de baja del mail.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResenaBaja'
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Demasiados pedidos: respetá el header `Retry-After` (segundos)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_token: []
        - client_id: []
      summary: Darse de baja de los mails de pedido de opinión
      tags:
        - Reseñas
  /api/v2/product_reviews/{id}/photos:
    post:
      description: >-
        Subida de fotos en dos pasos: (1) el alta (`POST /api/v2/product_reviews`) declara las fotos
        y devuelve `uploads` con una URL prefirmada por foto; (2) el navegador hace un `PUT` del
        archivo a cada `url` (mismo Content-Type, vence a los 10 min) y después llama a este
        endpoint con `position`, `key` y `pass` de cada una. Dentro de la hora de creada la opinión;
        reintentar no duplica. Las fotos quedan en moderación (sólo se muestran aprobadas). Una foto
        que no se pudo guardar va en `warnings`. Hasta 20 pedidos por hora por IP.
      operationId: Resenas_confirmarFotos
      parameters:
        - name: id
          required: true
          in: path
          description: Id de la opinión (el `id` del alta).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResenaConfirmarFotos'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResenaFotosConfirmadas'
        '400':
          description: Pedido mal formado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto (el recurso ya cambió de estado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Demasiados pedidos: respetá el header `Retry-After` (segundos)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_token: []
        - client_id: []
      summary: Confirmar las fotos subidas de una opinión (paso 2)
      tags:
        - Reseñas
  /api/v2/products:
    get:
      description: >-
        El listado sin categoría (todo el catálogo publicado, o el resultado de `q`), paginado con
        `page_number`. Para la página de una categoría usá `GET /api/v2/products/category/{slug}`.
      operationId: Products_index
      parameters:
        - name: page_number
          required: false
          in: query
          description: Página (desde 1). El tamaño de página lo decide la marca/categoría.
          schema:
            type: number
        - name: multicolors
          required: false
          in: query
          description: Colores separados por coma, p. ej. `Negro,Blanco`.
          schema:
            type: string
        - name: Color
          required: false
          in: query
          description: Un color (alternativa a `multicolors`).
          schema:
            type: string
        - name: multisizes
          required: false
          in: query
          description: Talles separados por coma, p. ej. `S,M`.
          schema:
            type: string
        - name: Talle
          required: false
          in: query
          description: Un talle (alternativa a `multisizes`).
          schema:
            type: string
        - name: Texture
          required: false
          in: query
          description: >-
            Nombre de la propiedad principal (textura). Además se puede filtrar por cualquier otra
            propiedad de la marca usando su nombre como parámetro y la descripción de la opción como
            valor (p. ej. `Material=Algodón`).
          schema:
            type: string
        - name: multicategories
          required: false
          in: query
          description: >-
            Slugs de categorías separados por coma (incluye subcategorías). Sólo marcas con la
            faceta `Categorias`.
          schema:
            type: string
        - name: min_and_max_price
          required: false
          in: query
          description: 'Rango de precio en JSON, en la moneda de la marca: `{"min":1000,"max":5000}`.'
          schema:
            type: string
        - name: discount_ranges
          required: false
          in: query
          description: >-
            Rangos de descuento separados por coma (`1-20,40-60`). Sólo si la marca muestra el
            filtro.
          schema:
            type: string
        - name: llega_hoy
          required: false
          in: query
          description: '`true`/`false`: envío en el día (sólo marcas que lo usan).'
          schema:
            type: string
        - name: variant_sku
          required: false
          in: query
          description: SKUs separados por espacio.
          schema:
            type: string
        - name: price
          required: false
          in: query
          description: 'Ordenar por precio: `1` ascendente, `-1` descendente.'
          schema:
            enum:
              - '1'
              - '-1'
            type: string
        - name: views
          required: false
          in: query
          description: Ordenar por más vistos (`-1`).
          schema:
            enum:
              - '1'
              - '-1'
            type: string
        - name: new
          required: false
          in: query
          description: Ordenar por más nuevos (`-1`).
          schema:
            enum:
              - '1'
              - '-1'
            type: string
        - name: q
          required: false
          in: query
          description: Texto libre de búsqueda.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductosListado'
      security:
        - storefront_token: []
        - client_id: []
      summary: Listado de productos
      tags:
        - Catálogo
      x-cache-tags:
        - products
      x-cache-ttl: short
  /api/v2/products/category/{slug}:
    get:
      description: >-
        Los productos de la categoría y sus subcategorías, con la categoría serializada (SEO,
        banners, FAQs) y el tamaño de página de su grilla (`items_per_page`).
      operationId: Products_category
      parameters:
        - name: slug
          required: true
          in: path
          description: Slug de la categoría
          schema:
            type: string
        - name: page_number
          required: false
          in: query
          description: Página (desde 1). El tamaño de página lo decide la marca/categoría.
          schema:
            type: number
        - name: multicolors
          required: false
          in: query
          description: Colores separados por coma, p. ej. `Negro,Blanco`.
          schema:
            type: string
        - name: Color
