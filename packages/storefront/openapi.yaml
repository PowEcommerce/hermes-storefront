        Textos, colores, reglas de aparición y los gajos de la rueda. `installed: false` = la app no
        está instalada (el sitio se comporta como antes de la app); `enabled: false` = está
        instalada pero apagada. Los premios vienen SIN peso y SIN tipo: las probabilidades no salen
        del servidor.
      operationId: Roulette_config
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed:
                    type: boolean
                  enabled:
                    type: boolean
                  title:
                    type: string
                  prizes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        label:
                          type: string
                        color:
                          type: string
                        position:
                          type: integer
      security:
        - storefront_token: []
        - client_id: []
