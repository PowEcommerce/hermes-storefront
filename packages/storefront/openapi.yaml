      parameters:
        - name: X-Idempotency-Key
          in: header
          description: >-
            Clave de idempotencia del intento de pago (texto imprimible, hasta 200 caracteres).
            Reintentar con la misma clave devuelve la misma respuesta sin volver a cobrar: mandala
            siempre y generá una nueva sólo para un intento nuevo.
          required: false
          schema:
            type: string
        - name: X-Cart-Token
          in: header
          description: >-
            Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` cuando el
            primer "agregar" crea el carrito.
          required: true
