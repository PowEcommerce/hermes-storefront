              schema:
                $ref: '#/components/schemas/CompradorAuthError'
        '503':
          description: No disponible para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompradorAuthError'
      security:
        - storefront_token: []
        - client_id: []
      summary: Ingresar con email y contraseña
      tags:
        - Cuenta
  /api/v2/users/sign_out:
    delete:
      description: Revoca la sesión (la del access y/o la del refresh). Siempre contesta `ok`.
      operationId: Users_signOut
      parameters:
        - name: X-Customer-Refresh
          in: header
          required: false
          schema:
            type: string
        - name: X-Customer-Token
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompradorStatusOk'
      security:
        - storefront_token: []
        - client_id: []
      summary: Cerrar la sesión
      tags:
        - Cuenta
  /api/v2/users/sign_up:
    post:
      description: >-
        Registra e inicia sesión. Los tokens de sesión vuelven en headers (`X-Customer-Token`, 15
        min; `X-Customer-Refresh`, rotativo): guardalos server-side (cookies httpOnly) y mandalos en
        cada pedido. 404 si la marca no usa cuentas de comprador de Pow.
      operationId: Users_signUp
      parameters:
        - name: X-Cart-Token
          in: header
          description: 'Carrito del invitado: al ingresar se fusiona con el de la cuenta.'
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompradorRegistrar'
      responses:
        '200':
          description: OK
          headers:
            X-Customer-Token:
              description: Access token del comprador (JWT, 15 min).
              schema:
                type: string
            X-Customer-Refresh:
              description: >-
                Refresh token rotativo: canjealo en `POST /api/v2/users/refresh`. Cada uso devuelve
                uno nuevo.
              schema:
                type: string
            X-Customer-Refresh-Max-Age:
              description: Vida del refresh, en segundos (para la cookie).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompradorAuthOk'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos o paso incompleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompradorAuthError'
        '429':
          description: 'Demasiados pedidos: respetá el header `Retry-After` (segundos)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No disponible para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompradorAuthError'
      security:
        - storefront_token: []
        - client_id: []
      summary: Crear una cuenta
      tags:
        - Cuenta
  /api/v2/users/verify_code:
    post:
      description: >-
        Valida el código (con el email) o el token del link del mail (sin email). Crea la cuenta si
        no existía (`first_time`). Los tokens de sesión vuelven en headers (`X-Customer-Token`, 15
        min; `X-Customer-Refresh`, rotativo): guardalos server-side (cookies httpOnly) y mandalos en
        cada pedido. 404 si la marca no usa cuentas de comprador de Pow.
      operationId: Users_verifyCode
      parameters:
        - name: X-Cart-Token
          in: header
          description: 'Carrito del invitado: al ingresar se fusiona con el de la cuenta.'
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompradorVerificarCodigo'
      responses:
        '200':
          description: OK
          headers:
            X-Customer-Token:
              description: Access token del comprador (JWT, 15 min).
              schema:
                type: string
            X-Customer-Refresh:
              description: >-
                Refresh token rotativo: canjealo en `POST /api/v2/users/refresh`. Cada uso devuelve
                uno nuevo.
              schema:
                type: string
            X-Customer-Refresh-Max-Age:
              description: Vida del refresh, en segundos (para la cookie).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompradorAuthOk'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompradorAuthError'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos o paso incompleto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompradorAuthError'
        '429':
          description: 'Demasiados pedidos: respetá el header `Retry-After` (segundos)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No disponible para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompradorAuthError'
      security:
        - storefront_token: []
        - client_id: []
      summary: Ingresar con el código del mail
      tags:
        - Cuenta
  /api/v2/webhook_subscriptions:
    get:
      description: >-
        Las suscripciones creadas con ESTE token (sin el secreto). Las que configura Pow desde el
        admin no aparecen.
      operationId: Webhooks_listar
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionLista'
        '401':
          description: Falta el token o es inválido / revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Funcionalidad no habilitada para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_private_token: []
      summary: Listar mis suscripciones
      tags:
        - Webhooks
    post:
      description: >-
        Eventos disponibles: `checkout/completed` (sólo de las sesiones de checkout creadas con el
        token público de tu agencia, el que Pow vinculó a este token privado) y
        `storefront/revalidate` (los tags de caché que Pow purga de la marca, agrupados cada ~10 s;
        ver `x-cache-tags` de cada GET). La `url` tiene que ser https, de un dominio público (sin
        IP, puerto ni credenciales) que no resuelva a una red interna. Hasta 10 suscripciones
        activas por token; 30 altas por día por token. La respuesta trae el `secret` de firma UNA
        sola vez: guardalo. Las entregas reales empiezan cuando Pow habilita los webhooks de la
        marca; el evento de prueba anda siempre.
      operationId: Webhooks_crear
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCrear'
      responses:
        '201':
          description: Suscripción creada (con el secreto, única vez)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionConSecreto'
        '401':
          description: Falta el token o es inválido / revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Datos inválidos: `{ "errors": ["…"] }`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errores'
        '429':
          description: 'Demasiados pedidos: respetá el header `Retry-After` (segundos)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Funcionalidad no habilitada para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_private_token: []
      summary: Crear una suscripción
      tags:
        - Webhooks
  /api/v2/webhook_subscriptions/{id}:
    delete:
      description: Deja de recibir eventos en el acto (los reintentos pendientes se descartan).
      operationId: Webhooks_borrar
      parameters:
        - name: id
          required: true
          in: path
          description: Id de la suscripción (el que devolvió el alta o el listado)
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: Falta el token o es inválido / revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Funcionalidad no habilitada para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_private_token: []
      summary: Borrar una suscripción
      tags:
        - Webhooks
  /api/v2/webhook_subscriptions/{id}/rotate_secret:
    post:
      description: >-
        Genera un secreto nuevo y lo devuelve UNA vez. El anterior deja de valer en el acto: los
        envíos (y reintentos) que salen desde ahora se firman con el nuevo.
      operationId: Webhooks_rotar
      parameters:
        - name: id
          required: true
          in: path
          description: Id de la suscripción (el que devolvió el alta o el listado)
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionConSecreto'
        '401':
          description: Falta el token o es inválido / revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Demasiados pedidos: respetá el header `Retry-After` (segundos)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Funcionalidad no habilitada para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_private_token: []
      summary: Rotar el secreto de firma
      tags:
        - Webhooks
  /api/v2/webhook_subscriptions/{id}/test:
    post:
      description: >-
        Manda en el momento un evento `webhook/test` a la URL de la suscripción, firmado y con los
        mismos headers que uno real, sin reintentos ni redirects. Devuelve `delivered` y el status
        HTTP con el que contestó tu endpoint si fue 2xx/4xx/5xx; cualquier otra cosa (redirect,
        timeout de 10 s, DNS, destino bloqueado) da `status: null`, sin detalle. 10 pruebas por hora
        por token.
      operationId: Webhooks_probar
      parameters:
        - name: id
          required: true
          in: path
          description: Id de la suscripción (el que devolvió el alta o el listado)
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPrueba'
        '401':
          description: Falta el token o es inválido / revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Demasiados pedidos: respetá el header `Retry-After` (segundos)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Funcionalidad no habilitada para esta marca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_private_token: []
      summary: Mandar un evento de prueba
      tags:
        - Webhooks
info:
  title: Pow Storefront API
  description: |-
    API pública del storefront de Pow (v2). Con ella una agencia construye un
    storefront headless sobre las marcas de Pow: catálogo, carrito, cuenta del
    comprador, checkout (propio o hosteado) y webhooks.

    **Autenticación.** Cada pedido identifica la marca con su token público
    `X-Storefront-Token: pst_…` (lo entrega Pow; puede viajar en el navegador).
    Las marcas que no exigen token aceptan `X-Client-ID: <marca>`. Las
    operaciones server-side de la agencia (leer una sesión de checkout, gestionar
    webhooks) usan el token PRIVADO `X-Storefront-Private-Token: psk_…`, que
    nunca debe llegar a un navegador.

    **Errores.** `{ "error": "mensaje" }` o `{ "errors": ["…", "…"] }` (validación,
    422). 429 trae `Retry-After` en segundos.

    **Formato.** Campos en snake_case. Montos en la moneda de la marca (número, no
    centavos) salvo que el campo diga lo contrario. Fechas ISO 8601.

    **Caché.** Cada GET cacheable trae `x-cache-tags` (plantillas de tags:
    `{nombre}` es el parámetro de path o de query con ese nombre; si el pedido no
    lo trae, ese tag no va) y `x-cache-ttl` (`short` = 60 s, `long` = 3600 s;
    `none` = no cachear). Taggeá tus fetch con esos tags y suscribite al webhook
    `storefront/revalidate`: Pow te manda los tags que purga (soft por defecto,
    hard cuando algo dejó de existir). El TTL es la red de seguridad.

    **Versionado.** `v2` es estable: sólo cambios aditivos (campos o endpoints
    nuevos). Un cambio incompatible sale en `v3`, con convivencia.

    Guía para agencias: https://github.com/PowEcommerce/hermes-storefront/blob/main/docs/guia-agencias.md.
  version: '2'
  contact: {}
tags:
  - name: Config
    description: >-
      Configuración de la marca para armar el storefront: moneda, checkout, apps instaladas,
      asesores de talle.
  - name: Catálogo
    description: Listados (PLP), filtros, categorías, ficha de producto (PDP), búsqueda y sitemap.
  - name: Contenido
    description: >-
      Home (page blocks), landings, páginas estáticas, settings del sitio (footer, anuncios, popups,
      integraciones) y locales.
  - name: Carrito
    description: 'Carrito v2: token `crt_` en `X-Cart-Token`, 30 días de vida, sin reserva de stock.'
  - name: Checkout
    description: >-
      Checkout propio paso a paso (identificación, envío, facturación, pago). Si preferís no
      construirlo, usá las sesiones de checkout hosteado.
  - name: Sesiones de checkout
    description: >-
      Checkout hosteado de Pow en el dominio de la marca: la agencia crea la sesión y redirige al
      comprador.
  - name: Cuenta
    description: >-
      Login/registro (email + contraseña, código por mail, Google), pedidos, direcciones y perfil
      del comprador.
  - name: Reseñas
    description: >-
      App Reseñas: lista y galería por producto, formulario, alta y baja de los mails de pedido de
      opinión.
  - name: Webhooks
    description: >-
      Suscripciones a webhooks de la marca (self-service con el token privado `psk_`) y evento de
      prueba.
servers:
  - url: https://api.pow.la
    description: Producción
components:
  securitySchemes:
    storefront_token:
      type: apiKey
      in: header
      name: X-Storefront-Token
      description: >-
        Token PÚBLICO de la marca (`pst_` + 40 hex). Identifica la marca; puede viajar en el
        navegador.
    client_id:
      type: apiKey
      in: header
      name: X-Client-ID
      description: >-
        Identificador de la marca (p. ej. `mi-marca`). Sólo para marcas que no exigen token; con
        token, el token manda.
    storefront_private_token:
      type: apiKey
      in: header
      name: X-Storefront-Private-Token
      description: >-
        Token PRIVADO de la agencia (`psk_` + 40 hex). SÓLO server-side. Sus permisos (scopes) los
        asigna Pow.
    cart_token:
      type: apiKey
      in: header
      name: X-Cart-Token
      description: >-
        Token del carrito (`crt_…`). Vuelve en el header de respuesta `X-Cart-Token` al crear el
        carrito; dura 30 días desde la última actividad.
    customer_token:
      type: apiKey
      in: header
      name: X-Customer-Token
      description: >-
        Access token del comprador (15 min). Vuelve en los headers de respuesta del login y de
        `users/refresh`.
    customer_refresh:
      type: apiKey
      in: header
      name: X-Customer-Refresh
      description: >-
        Refresh token rotativo del comprador: se canjea en `POST /api/v2/users/refresh` por un
        access nuevo (y un refresh nuevo).
  schemas:
    BloqueBanner:
      type: object
      properties:
        id:
          type: integer
        name:
          type:
            - string
            - 'null'
        position:
          type:
            - integer
            - 'null'
        width:
          type:
            - integer
            - 'null'
          description: Ancho en % (25, 33, 50, 66, 75 o 100).
        active:
          type:
            - boolean
            - 'null'
        classes:
          type:
            - string
            - 'null'
          description: Clases CSS del legacy.
        bootstrap_class:
          type: object
          properties:
            xs:
              type: string
              example: col-xs-12
            md:
              type: string
              example: flex-width-50p
          required:
            - xs
            - md
          description: Clases de grilla del legacy según `width`.
        content_text_position:
          type: string
          enum:
            - content_text_left
            - content_text_right
            - content_text_center
        type:
          type: string
          enum:
            - PageBlock::Banner
        href:
          type:
            - string
            - 'null'
          description: 'Link cargado a mano en el backoffice: absoluto, relativo o sin esquema.'
        title:
          type:
            - string
            - 'null'
        image:
          type:
            - string
            - 'null'
          format: uri
        mobile_image:
          type:
            - string
            - 'null'
          format: uri
          description: Arte mobile; si no hay, la misma `image`.
        text_color:
          type:
            - string
            - 'null'
      required:
        - id
        - name
        - position
        - width
        - active
        - classes
        - bootstrap_class
        - content_text_position
        - type
        - href
        - title
        - image
        - mobile_image
        - text_color
      description: Imagen (desktop/mobile) con link.
      additionalProperties: true
    BloqueBannerButton:
      type: object
      properties:
        id:
          type: integer
        name:
          type:
            - string
            - 'null'
        position:
          type:
            - integer
            - 'null'
        width:
          type:
            - integer
            - 'null'
          description: Ancho en % (25, 33, 50, 66, 75 o 100).
        active:
