      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompradorGoogle'
      responses:
        '200':
          description: OK
          headers:
            X-Customer-Token:
              description: Access token del comprador (JWT, 15 min).
              schema:
                type: string
            X-Customer-Refresh:
              description: >-
                Refresh token rotativo: canjealo en `POST /api/v2/users/refresh`. Cada uso devuelve
                uno nuevo.
              schema:
                type: string
            X-Customer-Refresh-Max-Age:
              description: Vida del refresh, en segundos (para la cookie).
              schema:
                type: string
          content:
