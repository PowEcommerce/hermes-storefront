    post:
      description: >-
        Sortea en el servidor con los pesos de los premios, da de alta el contacto, crea el cupón de
        un solo uso y devuelve la posición ganadora. `already_played: true` si ese email o ese
        dispositivo ya jugó en el período configurado. El código del cupón vuelve en `coupon` SOLO
        si la marca lo muestra en pantalla (`reveal_code_on_screen`) o si tiene apagado el mail del
        cupón; si no, `coupon` es `null` y `coupon_sent_by_email: true`: el código llega sólo por
        mail. Si la marca pasó su tope de cupones por hora responde `ok: false` con `errors: "La
        ruleta no está disponible"`.
      operationId: Roulette_spin
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                phone:
                  type: string
                accepts_marketing:
                  type: boolean
                device_token:
                  type: string
              required:
                - email
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  already_played:
                    type: boolean
                  errors:
                    type: string
                  prize:
                    type: object
                    properties:
                      id:
                        type: integer
                      position:
                        type: integer
                      label:
                        type: string
                      has_coupon:
                        type: boolean
                        description: El premio entrega cupón (sin revelar el tipo).
                  coupon:
                    type: object
                    nullable: true
                    description: >-
                      `null` si el premio no da cupón, si falló su creación o si la marca lo entrega
                      sólo por mail (ver `coupon_sent_by_email`).
                    properties:
                      code:
                        type: string
                      expires_on:
                        type: string
                  coupon_sent_by_email:
                    type: boolean
                    description: >-
                      Se creó un cupón y se manda por mail. Con `coupon: null` es el ÚNICO canal: el
                      front tiene que avisar «te lo mandamos por mail».
        '403':
          description: El token no tiene permiso para esto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Demasiados pedidos: respetá el header `Retry-After` (segundos)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - storefront_token: []
        - client_id: []
      summary: Girar la ruleta
      tags:
        - Config
      x-cache-ttl: none
