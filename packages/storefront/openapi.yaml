        - cart_token
        - return_url
        - cancel_url
        - expires_at
        - next
    CheckoutSessionCreada:
      type: object
      properties:
        id:
          type: string
          pattern: ^cs_[0-9a-f]{48}$
          example: cs_3f2a9c0e5b7d41a88e6f0c2d9b1a7e4c5d6f8a0b1c2d3e4f
        url:
          type: string
          format: uri
          description: >-
            Link al checkout en el dominio de la marca: el dominio propio activo de la tienda
            hosteada en Hermes (`www.<dominio>`, o `checkout.<dominio>`) o el storefront
            configurado.
          example: https://www.marca.com/checkout/s/cs_3f2a…
        expires_at:
          type: string
          format: date-time
      required:
        - id
        - url
        - expires_at
    CheckoutSessionCrear:
      type: object
      properties:
        cart_token:
          type: string
          description: Token del carrito (`crt_…`) con al menos una línea.
        return_url:
          type: string
          format: uri
          description: >-
            Opcional. A dónde vuelve el comprador al terminar (https, dominio permitido). Se le
            agregan `order_id` y `checkout_session_id` en la query. Sin ella (p. ej. desarrollando
            en localhost), la compra termina en la confirmación del checkout de la marca y "Volver a
            la tienda" va a la tienda de la marca.
          example: https://tienda.agencia.com/gracias
        cancel_url:
          type: string
          format: uri
          description: >-
            Opcional. A dónde vuelve si abandona o la sesión ya no sirve (https, dominio permitido).
            Sin ella, "Volver al carrito" y las pantallas de error del checkout llevan a la tienda
            de la marca.
          example: https://tienda.agencia.com/carrito
      required:
        - cart_token
